[versions]
kotlin = "2.4.20"
gradlePlugins-agp = "9.4.1"
app-build-compileSDKVersion = "36"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
androidx-webkit = "1.12.1"
androidx-documentfile = "1.1.0"
androidx-core = "1.15.0"
androidx-work = "2.10.1"
junit = "4.13.2"
compose-bom = "2026.06.01"
activity-compose = "1.10.1"

[libraries]
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-work = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
junit = { module = "junit:junit", version.ref = "junit" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
